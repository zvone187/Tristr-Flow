<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; media-src blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self';" />
    <link rel="stylesheet" href="overlay.css" />
    <title>Tristr Flow</title>
  </head>
  <body>
    <div id="card">
      <header id="bar">
        <button id="settings" title="Settings (Preferences)" aria-label="Settings">&#9881;&#xFE0E;</button>
        <div id="center">
          <button id="playpause" title="Play / Pause (Space)">❚❚</button>
          <div id="meta">
            <span id="dot"></span>
            <button id="voice" title="Change voice"><span id="voicename">Voice</span><span class="chev" aria-hidden="true">▾</span></button>
            <span id="status">Preparing…</span>
          </div>
        </div>
        <div id="rightctl">
          <div id="speedctl" title="Reading speed (← / →)">
            <button id="speeddown" aria-label="Slower">‹</button>
            <span id="speedval">1×</span>
            <button id="speedup" aria-label="Faster">›</button>
          </div>
          <button id="close" title="Stop &amp; close (Esc)" aria-label="Close">✕</button>
        </div>
      </header>

      <div id="voicepanel" hidden>
        <div id="voicelist"></div>
        <button id="voicemore">More voices in Preferences ↗</button>
      </div>

      <div id="textwrap">
        <div id="text"></div>
      </div>

      <div id="timerow">
        <span id="tcur">0:00</span>
        <span id="tdur">0:00</span>
      </div>
      <div id="progress"><div id="bar-fill"></div></div>
    </div>

    <!-- Resize handles: thin strips centred on the card's visible outline.
         The native frameless resize band is disabled, so these are the only
         way to resize — you have to actually be on the edge. -->
    <div class="rz rz-n"  data-edge="n"  aria-hidden="true"></div>
    <div class="rz rz-s"  data-edge="s"  aria-hidden="true"></div>
    <div class="rz rz-e"  data-edge="e"  aria-hidden="true"></div>
    <div class="rz rz-w"  data-edge="w"  aria-hidden="true"></div>
    <div class="rz rz-nw" data-edge="nw" aria-hidden="true"></div>
    <div class="rz rz-ne" data-edge="ne" aria-hidden="true"></div>
    <div class="rz rz-sw" data-edge="sw" aria-hidden="true"></div>
    <div class="rz rz-se" data-edge="se" aria-hidden="true"></div>

    <script src="richtext.js"></script>
    <script src="overlay.js"></script>
  </body>
</html>
